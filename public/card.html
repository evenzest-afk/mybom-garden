<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나의 봄 — 대기실 안내 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: A5; margin: 0; }
  :root { --paper:#F5F1E8; --ink:#35302A; --soft:#7C7466; --line:#D9D1BF; --gold:#B99B5A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#8C8578; font-family:"Gowun Batang",Georgia,serif; color:var(--ink);
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { width:148mm; height:210mm; background:var(--paper); padding:9mm;
          box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .inner { border:1px solid var(--line); height:100%; padding:12mm 10mm;
           display:flex; flex-direction:column; align-items:center; text-align:center; }
  .kicker { font-family:sans-serif; font-size:9pt; letter-spacing:3.5px; color:var(--soft); }
  .rule { width:34mm; height:1px; background:var(--line); margin:5mm 0; }
  h1 { font-size:30pt; letter-spacing:11px; text-indent:11px; font-weight:700; }
  .lead { font-size:11pt; line-height:2.1; color:var(--soft); margin-top:7mm; word-break:keep-all; }
  .mark { width:34mm; margin:7mm 0 5mm; }
  .mark svg { width:100%; height:auto; display:block; }
  .qr { width:44mm; height:44mm; border:1px solid var(--line); padding:2.5mm; background:#fff; }
  .qr svg { width:100%; height:100%; display:block; }
  .qr-label { font-family:sans-serif; font-size:9pt; letter-spacing:1.5px; color:var(--soft); margin-top:3.5mm; }
  .steps { display:flex; gap:6mm; margin-top:7mm; }
  .step { flex:1; }
  .step b { display:block; font-size:10pt; color:var(--gold); margin-bottom:1.5mm; }
  .step span { font-size:9.5pt; color:var(--soft); line-height:1.7; }
  .foot { margin-top:auto; font-size:9.5pt; letter-spacing:1.5px; color:var(--soft); }
  .print-btn { position:fixed; top:18px; right:18px; padding:10px 18px; background:var(--ink);
               color:var(--paper); border:0; font-family:inherit; font-size:13px; letter-spacing:2px; cursor:pointer; }
  @media print { body { background:#fff; padding:0; } .card { box-shadow:none; } .print-btn { display:none; } }
</style>
</head>
<body>
<button class="print-btn" onclick="window.print()">인쇄</button>
<div class="card"><div class="inner">
  <span class="kicker">참여형 설치 · 대기실 들판</span>
  <span class="rule"></span>
  <h1>나의 봄</h1>
  <p class="lead">
    벽면의 들판은 이곳을 다녀간<br>사람들의 마음으로 자랍니다.<br>
    오늘의 꽃 한 송이를 피워 보세요.
  </p>
  <div class="mark" id="mark"></div>
  <div class="qr" id="qr"></div>
  <p class="qr-label">휴대폰 카메라로 비춰 주세요<br>
    <span style="color:#5C7350">이름도 기록도 남지 않습니다 · 사진은 찍히지 않아요</span></p>
  <div class="steps">
    <div class="step"><b>하나</b><span>오늘 마음의<br>날씨 고르기</span></div>
    <div class="step"><b>둘</b><span>지금 나에게<br>필요한 것</span></div>
    <div class="step"><b>셋</b><span>꽃을 받아<br>들판에 심기</span></div>
  </div>
  <p class="foot">마음의 꽃은 피어 있다가 바람에 실려 떠납니다</p>
</div></div>
<script src="js/flower-svg.js"></script>
<script>
(async () => {
  const F = { name:'코스모스', shape:{type:'daisy',petals:8,len:52,w:24,centerR:12,notch:true},
              palettes:[{petal:'#D9A8BC',petalDeep:'#B97E97',center:'#CBA84F'}] };
  document.getElementById('mark').innerHTML = FlowerSVG.render(F, 0, { seed: 20260301 });
  try {
    const { svg } = await fetch('/api/qr').then(r => r.json());
    if (svg) document.getElementById('qr').innerHTML = svg;
  } catch (e) {}
})();
</script>
</body>
</html>
